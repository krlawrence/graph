name: Build Asciidoc and Deploy to Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4

      - name: Checkout (first-edition)
        uses: actions/checkout@v4
        with:
          ref: first-edition
          path: first-edition

      - name: Cache Ruby Gems
        uses: actions/cache@v3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends calibre pandoc

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install downdoc (AsciiDoc -> Markdown)
        run: npm install -g downdoc

      - name: Build Documentation (main)
        working-directory: ./book
        run: |
          gem install asciidoctor
          gem install asciidoctor-pdf          
          gem install pygments.rb
          asciidoctor Practical-Gremlin.adoc
          SEARCH_STRING="<h1>PRACTICAL GREMLIN: An Apache TinkerPop Tutorial<\/h1>"
          REPLACE_STRING='<img src="PRACTICAL-GREMLIN-2nd-edition.png">\n<h1>PRACTICAL GREMLIN:<br\/>An Apache TinkerPop Tutorial<\/h1>'
          sed -i "s|${SEARCH_STRING}|${REPLACE_STRING}|g" "Practical-Gremlin.html"
          mkdir ../target
          cp Practical-Gremlin.html ../target/index.html
          cp ../images/PRACTICAL-GREMLIN-2nd-edition.png ../target
          asciidoctor-pdf Practical-Gremlin.adoc -o ../target/Practical-Gremlin.pdf
          # Agent-friendly Markdown mirror + llms.txt index, with absolute links for the published site.
          SITE_URL="https://krlawrence.github.io/graph/"
          ruby ../bin/llms/split-markdown.rb --strict --site-url "$SITE_URL"
          ruby ../bin/llms/generate-llms-txt.rb --prefix "$SITE_URL" --out ../target/llms.txt ../target/md
          # Advertise llms.txt from the HTML so agents can discover it.
          sed -i 's#</head>#<link rel="alternate" type="text/markdown" title="llms.txt" href="llms.txt">\n</head>#' ../target/index.html

      - name: Build Documentation (first-edition)
        working-directory: ./first-edition/book
        run: |
          gem install asciidoctor        
          gem install pygments.rb
          asciidoctor Gremlin-Graph-Guide.adoc
          SEARCH_STRING="<h1>PRACTICAL GREMLIN: An Apache TinkerPop Tutorial<\/h1>"
          REPLACE_STRING='<img src="PRACTICAL-GREMLIN-Revised-v2.png">\n<h1>PRACTICAL GREMLIN:<br\/>An Apache TinkerPop Tutorial<\/h1>'
          # Insert the banner snippet just above the title so it is immediately visible
          sed -i "s|${SEARCH_STRING}|__BANNER_SNIPPET__\n&|" "Gremlin-Graph-Guide.html"
          sed -i '/__BANNER_SNIPPET__/{r banner-snippet.html
          d}' "Gremlin-Graph-Guide.html"
          # Replace the title with the image + line break version
          sed -i "s|${SEARCH_STRING}|${REPLACE_STRING}|g" "Gremlin-Graph-Guide.html"
          mkdir -p ../../target/first-edition
          cp Gremlin-Graph-Guide.html ../../target/first-edition/index.html
          cp ../images/PRACTICAL-GREMLIN-Revised-v2.png ../../target/first-edition/PRACTICAL-GREMLIN-Revised-v2.png

      - name: Validate llms.txt (Agent Friendly Documentation Spec)
        run: ./bin/validate-llms.sh

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'target'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
